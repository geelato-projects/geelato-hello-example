server.port=8082
spring.application.name=geelato-sample-orm

spring.datasource.url=jdbc:h2:mem:geelato_sample_orm;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时执行 schema.sql（建表 + H2 存储过程别名）
spring.sql.init.mode=always

logging.level.root=INFO
logging.level.cn.geelato=INFO

