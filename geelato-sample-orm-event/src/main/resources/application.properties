server.port=8083
spring.application.name=geelato-sample-orm-event

spring.datasource.url=jdbc:h2:mem:geelato_sample_orm_event;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时执行建表脚本
spring.sql.init.mode=always

logging.level.root=INFO
logging.level.cn.geelato=INFO

# ===== ORM 事件线程池配置（可选，省略则用默认值） =====
# 关闭事件线程池自动装配（回退到管理器默认池）
#geelato.orm.event.enabled=true
# 保存事件线程池：核心线程数 + 有界队列容量（队列满时由提交线程执行，背压不丢任务）
#geelato.orm.event.save.pool-size=4
#geelato.orm.event.save.queue-capacity=1000
# 删除事件线程池
#geelato.orm.event.delete.pool-size=4
#geelato.orm.event.delete.queue-capacity=1000
