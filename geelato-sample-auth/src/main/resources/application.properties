server.port=8084
spring.application.name=geelato-sample-auth

# demo 自有业务库（H2 内存）
spring.datasource.primary.name=primary
spring.datasource.primary.jdbc-url=jdbc:h2:mem:geelato_sample_auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.primary.username=sa
spring.datasource.primary.password=

# ORM：Fluent DSL 走 dynamicDao，数据权限注入器在其查询链路上生效
geelato.orm.dao-bean-name=dynamicDao
geelato.orm.default-data-source-key=primary
geelato.datasource.dynamic.enable-jta-transaction=false
geelato.datasource.dynamic.enable-seata-proxy=false

# Redis（与认证中心同实例：订阅 geelato:permission:change 权限变更通知）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# 认证中心接入配置（远程客户端：仅 HTTP，不依赖 Sa-Token、不共享 Sa-Token 会话）
demo.auth-center.base-url=http://localhost:9000
demo.auth-center.client-id=sample-auth
demo.auth-center.client-secret=
demo.auth-center.app-code=sample-auth
# introspect 结果按 token 缓存的秒数（减少重复网络调用）
demo.auth-center.introspect-cache-seconds=30
# 数据权限注入开关
demo.permission.data.enabled=true

logging.level.root=INFO
logging.level.cn.geelato=INFO
